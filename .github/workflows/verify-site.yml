name: Verify Site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        run: |
          echo "=== CSS links in homepage ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'href="[^"]*main\.css"' | head -5
          echo "=== CSS at root ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://magentaeseek.github.io/assets/css/main.css
          echo "=== CSS at baseurl ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://magentaeseek.github.io/LJT-Homepage/assets/css/main.css
          echo "=== Nav links ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'href="[^"]*publications[^"]*"' | head -5
          echo "=== Author sidebar ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'Junteng Liu|jliugi@connect.ust.hk|Vicent0205|HKUST|MINIMAX' | sort -u
          echo "=== About sections ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'Research Interests|Education|Research Experience|Publications|Awards|Contact' | sort -u
