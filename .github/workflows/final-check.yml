name: Final Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        run: |
          echo "=== Homepage ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://magentaeseek.github.io/LJT-Homepage/
          echo "=== Publications ==="
          curl -s -o /dev/null -w "%{http_code}\n" https://magentaeseek.github.io/LJT-Homepage/publications/
          echo "=== Title ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE '<title>[^<]*</title>'
          echo "=== Home sections ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'Research Interests|Education|Research Experience|Publications|Awards|Contact' | sort -u
          echo "=== Publications on home ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'SynLogic|C-Eval|Truthfulness|Perception Bottleneck|In-Context Sharpness|Composing Parameter' | sort -u
          echo "=== Publications page ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/publications/ | grep -oE 'SynLogic|C-Eval|Truthfulness|Perception Bottleneck|In-Context Sharpness|Composing Parameter' | sort -u
          echo "=== Sidebar ==="
          curl -s https://magentaeseek.github.io/LJT-Homepage/ | grep -oE 'Junteng Liu|jliugi@connect.ust.hk|Vicent0205|HKUST|MINIMAX|Tencent|Shanghai AI Lab|Zhiyuan' | sort -u
